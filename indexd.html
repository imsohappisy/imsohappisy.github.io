<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 1. 브라우저 호환성용 메타 리다이렉트 (0초 후 즉시 이동) -->
    <meta http-equiv="refresh" content="0; url=https://github.io">
    <link rel="canonical" href="https://github.io">
    <title>이동 중...</title>
    
    <!-- 2. 자바스크립트를 이용한 초고속 리다이렉트 -->
    <script type="text/javascript">
        window.location.href = "https://github.io";
    </script>
</head>
<body>
    <!-- 3. 만약의 사태를 대비한 수동 링크 -->
    <p>잠시 후 이동합니다. 자동으로 이동하지 않으면 <a href="https://github.io">여기</a>를 클릭하세요.</p>
</body>
</html>
